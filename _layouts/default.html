<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0e0e0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
{% include style.css %}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <main class="wrap">
    {{ content }}
  </main>
  <script>
    /* Background motion = always-on idle drift (pure CSS) + scroll layer.
       --p goes 0 -> 1 as you scroll top -> bottom and back again going up (same pace as the scroll).
       While you scroll, the idle drift also speeds up, then eases back to normal. */
    (function () {
      var root = document.documentElement;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var idle = [];
      try {
        idle = document.getAnimations().filter(function (a) {
          return a.animationName && a.animationName.indexOf("idle-") === 0;
        });
      } catch (e) {}
      var target = 0, current = 0, lastY = window.pageYOffset || 0, boost = 0, raf = 0;
      function measure() {
        var max = root.scrollHeight - window.innerHeight;
        var y = window.pageYOffset || root.scrollTop || 0;
        target = max > 0 ? Math.min(1, Math.max(0, y / max)) : 0;
        if (!raf) raf = requestAnimationFrame(tick);
      }
      function tick() {
        var y = window.pageYOffset || 0;
        var speed = Math.min(Math.abs(y - lastY) / 30, 1.5);  /* scroll speed this frame, capped */
        lastY = y;
        boost += (speed - boost) * 0.08;                       /* rises with scrolling, decays when it stops */
        current += (target - current) * 0.14;
        if (Math.abs(target - current) < 0.0005) current = target;
        root.style.setProperty("--p", current.toFixed(4));
        var rate = 1 + boost * 1.6;                            /* 1x idle, up to ~3x while scrolling hard */
        for (var i = 0; i < idle.length; i++) {
          try { idle[i].updatePlaybackRate(rate); } catch (e) { idle[i].playbackRate = rate; }
        }
        raf = (current === target && boost < 0.003) ? 0 : requestAnimationFrame(tick);
        if (!raf && idle.length) for (var j = 0; j < idle.length; j++) { try { idle[j].updatePlaybackRate(1); } catch (e) {} }
      }
      window.addEventListener("scroll", measure, { passive: true });
      window.addEventListener("resize", measure);
      measure();
    })();
  </script>
</body>
</html>
