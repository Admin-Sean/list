<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0e0e0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
{% include style.css %}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <main class="wrap">
    {{ content }}
  </main>
  <script>
    /* Scroll-linked background: --p goes 0 -> 1 as you scroll top -> bottom, and back again going up.
       Same pace as the scroll (linear), eased slightly so it glides instead of stepping. */
    (function () {
      var root = document.documentElement;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var target = 0, current = 0, raf = 0;
      function measure() {
        var max = root.scrollHeight - window.innerHeight;
        var y = window.pageYOffset || root.scrollTop || 0;
        target = max > 0 ? Math.min(1, Math.max(0, y / max)) : 0;
        if (!raf) raf = requestAnimationFrame(tick);
      }
      function tick() {
        current += (target - current) * 0.14;
        if (Math.abs(target - current) < 0.0005) current = target;
        root.style.setProperty("--p", current.toFixed(4));
        raf = current === target ? 0 : requestAnimationFrame(tick);
      }
      window.addEventListener("scroll", measure, { passive: true });
      window.addEventListener("resize", measure);
      measure();
    })();
  </script>
</body>
</html>
