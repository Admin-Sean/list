<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0e0e0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
{% include style.css %}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <main class="wrap">
    {{ content }}
  </main>
  <script>
    /* Background motion. Every field follows a random-looking path that is a pure function of one number, t:
       sums of three slow sine waves per axis (plus rotation and scale), with phases and speeds chosen at random
       once per visit. t = time (slow, always moving forward) + scroll position. Scrolling down moves t
       forward, scrolling up moves it back, so the background always retraces the route it just took. */
    (function () {
      var root = document.documentElement;
      var els = Array.prototype.slice.call(document.querySelectorAll(".bg i"));
      if (!els.length) return;
      var seed = (Math.random() * 4294967296) >>> 0;
      function rand() {                                   /* mulberry32 */
        seed = (seed + 0x6D2B79F5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      function between(a, b) { return a + (b - a) * rand(); }
      var BANDS = [[0.06, 0.11, 0.55], [0.14, 0.24, 0.30], [0.30, 0.50, 0.15]];  /* rad per unit t, weight */
      function wave(amp) {
        return BANDS.map(function (b) { return { a: amp * b[2], w: between(b[0], b[1]), p: between(0, 6.2832) }; });
      }
      function sample(c, t) {
        var s = 0;
        for (var i = 0; i < c.length; i++) s += c[i].a * Math.sin(c[i].w * t + c[i].p);
        return s;
      }
      /* per field: travel x, travel y (vmax), rotation (deg), scale swing */
      var SPEC = [[34, 26, 30, 0.16], [36, 24, 30, 0.14], [40, 22, 35, 0.20], [30, 28, 40, 0.25]];
      var fields = els.map(function (el, i) {
        var sp = SPEC[i % SPEC.length];
        return { el: el, x: wave(sp[0]), y: wave(sp[1]), r: wave(sp[2]), s: wave(sp[3]) };
      });
      function draw(t) {
        for (var i = 0; i < fields.length; i++) {
          var f = fields[i];
          f.el.style.transform = "translate3d(" + sample(f.x, t).toFixed(2) + "vmax," + sample(f.y, t).toFixed(2) +
            "vmax,0) rotate(" + sample(f.r, t).toFixed(2) + "deg) scale(" + (1 + sample(f.s, t)).toFixed(3) + ")";
        }
      }
      var K = 0.02;                                       /* path units per scrolled pixel */
      function scrollT() { return (window.pageYOffset || root.scrollTop || 0) * K; }
      var smooth = scrollT(), idle = 0, last = performance.now();
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { draw(smooth); return; }
      function frame(now) {
        var dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        idle += dt;                                       /* always drifting forward when you are still */
        smooth += (scrollT() - smooth) * (1 - Math.exp(-dt * 9));   /* glide toward the scroll position */
        draw(idle + smooth);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
